<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Подготовка пакета и поиск в Onec Context Toolkit</title>
<desc id="desc">Подготовка: локальные HBK, временное извлечение, сжатый пакет SQLite. При первом чтении SQLite извлекается в постоянный кэш. Поиск по точному имени или FTS5 возвращает записи с источником и версией. Временные файлы сборки удаляются, пакет и кэш сохраняются.</desc>
<rect width="1200" height="520" rx="24" fill="#f5f7fa"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172536">
<text x="40" y="51" font-size="24" font-weight="700">Подготовка при изменении источника</text>
<g fill="#fff" stroke="#d4deea" stroke-width="2"><rect x="40" y="76" width="300" height="112" rx="14"/><rect x="440" y="76" width="320" height="112" rx="14"/><rect x="860" y="76" width="300" height="112" rx="14"/></g>
<g font-size="23" font-weight="700"><text x="62" y="118">Локальные HBK</text><text x="462" y="118">Извлечение записей</text><text x="882" y="118">Пакет SQLite + Zstd</text></g>
<g font-size="18" fill="#506174"><text x="62" y="153">Выбранная версия платформы</text><text x="462" y="153">Временный каталог сборки</text><text x="882" y="153">Готов для повторного чтения</text></g>
<text x="40" y="250" font-size="24" font-weight="700">Поиск при работе над задачей</text>
<g fill="#fff" stroke="#d4deea" stroke-width="2"><rect x="40" y="276" width="300" height="112" rx="14"/><rect x="440" y="276" width="320" height="112" rx="14"/><rect x="860" y="276" width="300" height="112" rx="14"/></g>
<g font-size="23" font-weight="700"><text x="62" y="318">Вопрос агента</text><text x="462" y="318">SQLite в локальном кэше</text><text x="882" y="318">Записи из источника</text></g>
<g font-size="18" fill="#506174"><text x="62" y="353">Инструмент внутри skill</text><text x="462" y="353">Точное имя или FTS5</text><text x="882" y="353">Тема, версия, доступные поля</text></g>
<g fill="none" stroke="#3468ab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M360 132h60m-8-8 8 8-8 8"/><path d="M780 132h60m-8-8 8 8-8 8"/><path d="M360 332h60m-8-8 8 8-8 8"/><path d="M780 332h60m-8-8 8 8-8 8"/></g>
<text x="40" y="440" font-size="19" fill="#506174">Первое чтение распаковывает SQLite в кэш. Следующие обращения используют его повторно.</text>
<text x="40" y="475" font-size="19" fill="#506174">Временные файлы сборки удаляются; исходники, готовый пакет и действующий кэш сохраняются.</text>
</g></svg>
