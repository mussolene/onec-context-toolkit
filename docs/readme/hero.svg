<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Onec Context Toolkit: справка рядом с агентом</title>
<desc id="desc">Skill содержит инструменты. Они читают локальный пакет SQLite и возвращают агенту факты с источником и версией. Пакет можно подготовить из HBK или установить готовым. Сервер для поиска не нужен.</desc>
