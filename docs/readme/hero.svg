<g font-family="Arial, Helvetica, sans-serif" fill="#172536">
<text x="52" y="65" font-size="20" font-weight="700" fill="#3468ab">ONEC CONTEXT TOOLKIT</text>
<text x="52" y="125" font-size="42" font-weight="700">Справка 1С рядом с агентом</text>
<text x="52" y="166" font-size="21" fill="#506174">Локальные инструменты. Проверяемые источники. Поиск без сервера.</text>
<g fill="#fff" stroke="#d4deea" stroke-width="2">
<rect x="52" y="212" width="320" height="170" rx="16"/>
