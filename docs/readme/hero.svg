<text x="76" y="249">01 / УСТАНОВКА</text><text x="464" y="249">02 / ДАННЫЕ</text><text x="852" y="249">03 / РАБОТА</text>
</g>
<g font-size="26" font-weight="700">
<text x="76" y="292">Один skill</text><text x="464" y="292">Локальная база</text><text x="852" y="292">Точный контекст</text>
</g>
<g font-size="19" fill="#506174">
<text x="76" y="329">Инструкции и инструменты</text><text x="76" y="355">для Codex, Claude, Cursor</text>
<text x="464" y="329">Готовый пакет или сборка</text><text x="464" y="355">из справки платформы HBK</text>
<text x="852" y="329">API, версия и источник</text><text x="852" y="355">для решения задачи</text>
</g>
